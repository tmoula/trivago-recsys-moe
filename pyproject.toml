[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "trivago-moe"
version = "0.1.0"
description = "Persona-conditioned mixture-of-experts for cross-domain (retail -> travel) session recommendation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "huggingface_hub>=0.20",
]

[project.optional-dependencies]
personas = ["scikit-learn>=1.3", "sentence-transformers>=2.2", "faiss-cpu>=1.7"]
notebook = ["jupyter", "matplotlib", "seaborn"]
dev = ["pytest>=7", "nbstripout>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
